spring:
  application:
    name: smart-recruit

  datasource:
    url: jdbc:mysql://localhost:3306/smart_recruit?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.recruit.smartrecruit.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

server:
  port: 8081

# ==================== 日志配置 ====================

logging:
  # 日志级别
  level:
    root: INFO
    com.recruit.smartrecruit: INFO
    com.recruit.smartrecruit.mapper: DEBUG

  # 日志文件
  file:
    name: logs/smart-recruit.log

  # 日志输出格式
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread][%X{traceId}][userId=%X{userId}] %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread][%X{traceId}][userId=%X{userId}] %logger{50} - %msg%n"

  # 日志文件滚动
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
      file-name-pattern: logs/smart-recruit.%d{yyyy-MM-dd}.%i.log